name: One-time trip data refactor

on:
  push:
    branches: [main]
    paths:
      - "scripts/refactor-trip.mjs"
      - ".github/workflows/refactor-trip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-trip-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split trip data
        run: node scripts/refactor-trip.mjs

      - name: Commit generated modules
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Split trip data into focused modules"
          git push
