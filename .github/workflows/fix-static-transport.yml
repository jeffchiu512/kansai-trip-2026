name: One-time static transport fixes

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-static-transport.mjs"
      - ".github/workflows/fix-static-transport.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: node scripts/fix-static-transport.mjs
      - name: Commit generated data
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journeys.js data/days/d3.js
          git commit -m "Complete static transport details"
          git push
