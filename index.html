<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>關西食光散策 · 8日行程隨身導覽</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./css/app.css?v=8">
    <meta name="theme-color" content="#1d3557">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="關西食光散策">
</head>
<body>
    <header class="header">
        <div class="header-title">
            <span id="headerTitle">關西食光散策 · 隨身導覽</span>
            <span id="headerDays" style="font-size:0.85rem; font-weight:normal; background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:12px;">8 Days</span>
        </div>
        <div class="header-subtitle" id="headerSubtitle">10/7 (三) － 10/14 (三) 大阪 · 京都 · 奈良 · 箕面</div>
    </header>

    <nav class="nav-scroller" aria-label="選擇行程日期">
        <div class="nav-tabs" id="dayTabs"></div>
    </nav>

    <main class="container" id="appContent">
        <noscript>此行程導覽需要啟用 JavaScript 才能顯示。</noscript>
    </main>

    <nav class="bottom-nav" aria-label="主要功能">
        <button class="b-nav-item active" id="bnav-trip" type="button" data-main-nav="trip">
            <span class="b-nav-icon">⛩️</span>
            <span>每日行程</span>
        </button>
        <button class="b-nav-item" id="bnav-shopping" type="button" data-main-nav="shopping">
            <span class="b-nav-icon">🛍️</span>
            <span>購物清單</span>
        </button>
        <button class="b-nav-item" id="bnav-info" type="button" data-main-nav="info">
            <span class="b-nav-icon">ℹ️</span>
            <span>旅途資訊</span>
        </button>
    </nav>

    <script type="module" src="./js/app.js?v=10"></script>
</body>
</html>
